<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SK Magic RM17 Promo</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
text-align:center;
}

/* BACKGROUND */
body::before{
content:'';
position:fixed;
width:200%;
height:200%;
background:radial-gradient(circle,gold 1px,transparent 1px);
background-size:45px 45px;
opacity:.12;
animation:move 20s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-200px);}
}

/* CONTAINER */
.container{
max-width:800px;
margin:auto;
padding:20px;
}

/* IMAGE */
img{
width:100%;
border-radius:20px;
box-shadow:0 0 40px gold;
}

/* BUTTON */
a{
display:inline-block;
margin-top:20px;
background:#25D366;
color:white;
padding:18px 30px;
border-radius:50px;
text-decoration:none;
font-size:20px;
font-weight:bold;
box-shadow:0 0 25px #25D366;
}

</style>
</head>

<body>

<div class="container">

<img src="promo.jpg">

<h2>🔥 SK MAGIC RM17 PROMO</h2>

<p>Klik bawah untuk order sekarang</p>

<a id="buy">📲 ORDER SEKARANG</a>

</div>

<script>

/* WHATSAPP NUMBER LIST */
const numbers = [
"60105332502",
"60107849217",
"60196304577",
"601137602747"
];

/* GET GLOBAL COUNTER */
async function getIndex(){
let res = await fetch("https://api.countapi.xyz/get/skmagic/global");
let data = await res.json();
return data.value || 0;
}

/* INCREMENT GLOBAL COUNTER */
async function updateIndex(){
await fetch("https://api.countapi.xyz/hit/skmagic/global");
}

/* CLICK BUTTON */
document.getElementById("buy").addEventListener("click", async function(){

let index = await getIndex();

let phone = numbers[index % numbers.length];

/* naikkan global rotator */
await updateIndex();

/* redirect whatsapp */
window.location.href =
"https://wa.me/" + phone +
"?text=" + encodeURIComponent("Saya berminat SK Magic RM17");

});

</script>

</body>
</html>
