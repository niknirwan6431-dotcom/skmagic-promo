<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SK Magic RM17 | MASTER FUNNEL</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:'';
position:fixed;
width:200%;
height:200%;
background:radial-gradient(circle,gold 1px,transparent 1px);
background-size:40px 40px;
opacity:.12;
animation:move 20s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-200px);}
}

/* CONTAINER */
.container{
max-width:900px;
margin:auto;
padding:15px;
}

/* CARD */
.card{
position:relative;
border-radius:25px;
overflow:hidden;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,215,0,0.4);
box-shadow:0 0 50px rgba(255,215,0,0.2);
}

/* IMAGE */
img{
width:100%;
display:block;
animation:zoom 6s ease-in-out infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

/* BADGE */
.badge{
position:absolute;
top:15px;
left:15px;
background:red;
padding:10px 15px;
border-radius:50px;
font-weight:bold;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

/* TIMER */
.timer{
text-align:center;
padding:15px;
background:#111;
}

#time{
font-size:44px;
color:gold;
font-weight:bold;
}

/* LIVE */
.live{
position:fixed;
top:15px;
right:15px;
background:#111;
border-left:4px solid lime;
padding:10px 15px;
border-radius:10px;
font-size:13px;
}

/* POPUP */
.popup{
position:fixed;
bottom:90px;
left:20px;
background:#111;
border-left:4px solid gold;
padding:12px 15px;
border-radius:10px;
font-size:13px;
display:none;
z-index:999;
}

/* CTA BUTTON */
a{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#25D366;
color:white;
padding:18px 30px;
border-radius:50px;
font-size:20px;
font-weight:bold;
text-decoration:none;
box-shadow:0 0 25px #25D366;
animation:shake 1s infinite;
z-index:999;
}

@keyframes shake{
50%{transform:translateX(-50%) scale(1.05);}
}

/* EXIT */
.exit{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.exit-box{
background:#111;
padding:20px;
border-radius:20px;
text-align:center;
border:2px solid gold;
}

</style>
</head>

<body>

<div class="live" id="live">🔥 5 orang sedang checkout sekarang</div>

<div class="container">

<div class="card">

<div class="badge">🔥 RM17 LIMITED</div>

<img src="promo.jpg">

<div class="timer">
⏰ PROMO TAMAT
<div id="time">01:15:00</div>
</div>

</div>

</div>

<div class="popup" id="popup"></div>

<a href="#" id="buy">📲 ORDER SEKARANG</a>

<div class="exit" id="exit">
<div class="exit-box">
<h3>⚠️ Tunggu!</h3>
<p>Promo masih aktif sekarang 🔥</p>
<button onclick="document.getElementById('exit').style.display='none'">Teruskan</button>
</div>
</div>

<script>

/* TIMER */
let duration = 4500;
let remaining = duration;

function timer(){
let h = Math.floor(remaining/3600);
let m = Math.floor((remaining%3600)/60);
let s = remaining%60;

document.getElementById("time").innerHTML =
String(h).padStart(2,'0')+":"+
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0');

if(remaining>0) remaining--;
}
setInterval(timer,1000);
timer();

/* WHATSAPP ROUND ROBIN */
const numbers = [
"60105332502",
"60107849217",
"60196304577",
"601137602747"
];

let index = localStorage.getItem("wa_index");
index = index ? parseInt(index) : 0;

/* LIVE COUNTER */
setInterval(()=>{
document.getElementById("live").innerHTML =
"🔥 " + (Math.floor(Math.random()*8)+3) + " orang sedang checkout sekarang";
},4000);

/* POPUP */
const names = ["Ahmad","Siti","Nurul","Aiman","Farah","Hakim","Syafiq"];

setInterval(()=>{

let n = names[Math.floor(Math.random()*names.length)];

document.getElementById("popup").style.display="block";
document.getElementById("popup").innerHTML =
"✔ " + n + " baru order SK Magic";

setTimeout(()=>{
document.getElementById("popup").style.display="none";
},3000);

},5000);

/* ORDER */
document.getElementById("buy").addEventListener("click",function(e){
e.preventDefault();

let phone = numbers[index];

index = (index + 1) % numbers.length;
localStorage.setItem("wa_index", index);

let msg = "Saya berminat SK Magic RM17";

window.location.href =
"https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);

});

/* EXIT INTENT */
document.addEventListener("mouseleave",function(e){
if(e.clientY < 10){
document.getElementById("exit").style.display="flex";
}
});

</script>

</body>
</html>
