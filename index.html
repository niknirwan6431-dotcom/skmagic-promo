<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SK Magic RM17 Promo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
position:relative;
}

/* PARTICLES */

body::before{
content:'';
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#ffd700 1px,transparent 1px);
background-size:40px 40px;
opacity:.12;
animation:moveParticles 20s linear infinite;
}

@keyframes moveParticles{
0%{transform:translateY(0);}
100%{transform:translateY(-200px);}
}

.container{
width:100%;
max-width:850px;
position:relative;
padding:15px;
}

/* GOLD GLOW */

.glow{
position:absolute;
inset:-10px;
background:linear-gradient(45deg,#ffcc00,#ff9900,#ffcc00);
filter:blur(35px);
z-index:-1;
border-radius:30px;
animation:glowRotate 8s linear infinite;
}

@keyframes glowRotate{
100%{
filter:blur(35px) hue-rotate(360deg);
}
}

/* IMAGE */

.poster{
width:100%;
border-radius:25px;
display:block;
animation:zoomPoster 8s infinite alternate;
box-shadow:0 0 40px gold;
}

@keyframes zoomPoster{
from{
transform:scale(1);
}
to{
transform:scale(1.03);
}
}

/* LIGHT SWEEP */

.light{
position:absolute;
top:-20%;
left:-60%;
width:40%;
height:180%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.8),
transparent
);
transform:rotate(25deg);
animation:sweep 4s linear infinite;
pointer-events:none;
}

@keyframes sweep{
0%{
left:-60%;
}
100%{
left:150%;
}
}

/* LIGHTNING */

.flash{
position:absolute;
inset:0;
background:white;
opacity:0;
pointer-events:none;
animation:lightning 8s infinite;
}

@keyframes lightning{

0%,94%,100%{
opacity:0;
}

95%{
opacity:.7;
}

96%{
opacity:0;
}

97%{
opacity:.5;
}

98%{
opacity:0;
}

}

/* NOTIFICATION */

.notification{
position:fixed;
top:20px;
left:20px;
background:#111;
color:#fff;
padding:15px 20px;
border-left:5px solid gold;
border-radius:10px;
font-weight:bold;
z-index:9999;
box-shadow:0 0 20px gold;
}

/* COUNTDOWN */

.countdown{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.85);
padding:18px;
border-radius:20px;
width:80%;
max-width:420px;
text-align:center;
box-shadow:0 0 20px gold;
}

.countdown h3{
color:white;
margin-bottom:8px;
}

#timer{
font-size:42px;
font-weight:900;
color:#FFD700;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
bottom:25px;
right:25px;
background:#25D366;
color:white;
text-decoration:none;
padding:18px 28px;
border-radius:50px;
font-size:22px;
font-weight:bold;
box-shadow:0 0 25px #25D366;
z-index:9999;
animation:shake 1.2s infinite;
}

@keyframes shake{

0%,100%{
transform:translateX(0);
}

25%{
transform:translateX(-3px);
}

50%{
transform:translateX(3px);
}

75%{
transform:translateX(-3px);
}

}

@media(max-width:768px){

#timer{
font-size:30px;
}

.whatsapp{
font-size:18px;
padding:15px 22px;
}

.notification{
font-size:13px;
max-width:250px;
}

}

</style>
</head>

<body>

<div class="notification" id="notification">
🔥 Ahmad dari Kuantan baru sahaja mendaftar!
</div>

<div class="container">

<div class="glow"></div>

<img src="promo.jpg" class="poster">

<div class="light"></div>

<div class="flash"></div>

<div class="countdown">
<h3>⏰ PROMOSI AKAN TAMAT DALAM</h3>
<div id="timer">01:15:00</div>
</div>

</div>

<a href="https://wa.me/60123456789"
class="whatsapp"
id="waBtn"
target="_blank">
📲 DAFTAR SEKARANG
</a>

<script>

/* TIMER */

let duration = 4500;
let remaining = duration;

function updateTimer(){

let h = Math.floor(remaining/3600);
let m = Math.floor((remaining%3600)/60);
let s = remaining%60;

document.getElementById("timer").innerHTML =
String(h).padStart(2,'0') + ":" +
String(m).padStart(2,'0') + ":" +
String(s).padStart(2,'0');

if(remaining > 0){
remaining--;
}

}

setInterval(updateTimer,1000);
updateTimer();

/* RESET TIMER BILA KLIK WHATSAPP */

document.getElementById("waBtn")
.addEventListener("click",function(){

remaining = duration;

});

/* POPUP PELANGGAN */

const names = [
"Ahmad dari Kuantan",
"Siti dari Temerloh",
"Hafiz dari Melaka",
"Aiman dari Penang",
"Nurul dari Johor",
"Farah dari Shah Alam",
"Azlan dari Kuala Lumpur",
"Syafiq dari Ipoh",
"Hakim dari Seremban"
];

setInterval(()=>{

let random =
names[Math.floor(Math.random()*names.length)];

document.getElementById("notification").innerHTML =
"🔥 " + random + " baru sahaja mendaftar!";

},5000);

</script>

</body>
</html>
