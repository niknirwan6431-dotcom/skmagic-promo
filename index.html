<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Magic Promo RM17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow-x:hidden;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
position:relative;
width:100%;
max-width:800px;
}

.poster{
width:100%;
border-radius:20px;
box-shadow:0 0 40px #ffae00;
animation:zoomEffect 6s infinite alternate;
}

@keyframes zoomEffect{
from{transform:scale(1);}
to{transform:scale(1.03);}
}

/* Motion Light */
.light{
position:absolute;
top:-20%;
left:-50%;
width:50%;
height:160%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.6),
transparent
);
transform:rotate(25deg);
animation:shine 4s linear infinite;
pointer-events:none;
}

@keyframes shine{
0%{
left:-60%;
}
100%{
left:150%;
}
}

/* Lightning Effect */

.lightning{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
background:white;
opacity:0;
pointer-events:none;
animation:flash 7s infinite;
}

@keyframes flash{

0%,90%,100%{
opacity:0;
}

91%{
opacity:0.6;
}

92%{
opacity:0;
}

93%{
opacity:0.4;
}

94%{
opacity:0;
}

}

/* Glow Border */

.glow{
position:absolute;
inset:-5px;
border-radius:25px;
background:linear-gradient(
45deg,
gold,
orange,
yellow,
gold
);
z-index:-1;
filter:blur(20px);
animation:rotateGlow 6s linear infinite;
}

@keyframes rotateGlow{

0%{
filter:blur(20px) hue-rotate(0deg);
}

100%{
filter:blur(20px) hue-rotate(360deg);
}

}

.whatsapp{
position:fixed;
bottom:25px;
right:25px;
background:#25D366;
color:white;
text-decoration:none;
padding:18px 30px;
border-radius:50px;
font-size:22px;
font-weight:bold;
box-shadow:0 0 25px #25D366;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

</style>
</head>
<body>

<div class="container">

<div class="glow"></div>

<img src="promo.jpg" class="poster">

<div class="light"></div>

<div class="lightning"></div>

</div>

<a href="https://wa.me/60123456789"
class="whatsapp"
target="_blank">
📲 DAFTAR SEKARANG
</a>

</body>
</html>
