<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SK Magic Test</title>

<style>
body{
margin:0;
background:black;
color:white;
text-align:center;
font-family:Arial;
}

img{
width:90%;
margin-top:20px;
border-radius:20px;
box-shadow:0 0 30px gold;
}

button{
margin-top:20px;
padding:15px 25px;
border:none;
border-radius:30px;
background:#25D366;
color:white;
font-size:18px;
cursor:pointer;
}

#timer{
font-size:40px;
color:gold;
margin-top:20px;
}
</style>
</head>

<body>

<h2>🔥 SK MAGIC RM17</h2>

<img src="promo.jpg">

<div id="timer">01:15:00</div>

<button id="btn">ORDER SEKARANG</button>

<script>

/* TIMER */
let t = 4500;

setInterval(()=>{

let h = Math.floor(t/3600);
let m = Math.floor((t%3600)/60);
let s = t%60;

document.getElementById("timer").innerHTML =
String(h).padStart(2,'0')+":"+
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0');

if(t>0) t--;

},1000);

/* CLICK TEST */
document.getElementById("btn").addEventListener("click",function(){
window.location.href="https://wa.me/60105332502?text=Test";
});

</script>

</body>
</html>
